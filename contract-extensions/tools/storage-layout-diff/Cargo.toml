[package]
name = "storage-layout-diff"
version = "0.1.0"
edition = "2021"
description = "Compares the #[ink(storage)] layout of two contract versions for upgrade safety"
publish = false

[dependencies]
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
