[package]
name = "overflow-detector"
version = "0.1.0"
edition = "2021"
description = "Detects unchecked integer arithmetic and truncating casts in ink! contract sources"
publish = false

[dependencies]
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }

# Standalone: not a member of the main workspace.
[workspace]
