[package]
name = "reentrancy-scanner"
version = "0.1.0"
edition = "2021"
description = "Scans ink! contract sources for reentrancy vulnerabilities"
publish = false

[dependencies]
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }

# Standalone: not a member of the main workspace.
[workspace]
