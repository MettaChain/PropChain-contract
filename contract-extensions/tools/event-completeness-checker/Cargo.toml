[package]
name = "event-completeness-checker"
version = "0.1.0"
edition = "2021"
description = "Checks that every state-changing ink! message emits an event"
publish = false

[dependencies]
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }

# Standalone: not a member of the main workspace.
[workspace]
