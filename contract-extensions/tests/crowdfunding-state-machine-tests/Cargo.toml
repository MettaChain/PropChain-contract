[package]
name = "crowdfunding-state-machine-tests"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
ink = { version = "5.0.0", default-features = false }
scale = { package = "parity-scale-codec", version = "3.6.9", default-features = false, features = ["derive"] }
scale-info = { version = "2.10.0", default-features = false, features = ["derive"] }
propchain-crowdfunding = { path = "../../../contracts/crowdfunding", default-features = false }
propchain-traits = { path = "../../../contracts/traits", default-features = false }

[features]
default = ["std"]
std = ["ink/std", "scale/std", "scale-info/std", "propchain-crowdfunding/std", "propchain-traits/std"]

# Standalone: not a member of the main workspace.
[workspace]
