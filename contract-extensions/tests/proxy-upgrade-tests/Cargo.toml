[package]
name = "proxy-upgrade-tests"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
ink = { version = "5.0.0", default-features = false }
scale = { package = "parity-scale-codec", version = "3.6.9", default-features = false, features = ["derive"] }
scale-info = { version = "2.10.0", default-features = false, features = ["derive"] }
propchain-proxy = { path = "../../../contracts/proxy", default-features = false }

[features]
default = ["std"]
std = ["ink/std", "scale/std", "scale-info/std", "propchain-proxy/std"]

# Standalone: not a member of the main workspace.
[workspace]
