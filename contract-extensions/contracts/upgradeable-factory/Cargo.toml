[package]
name = "upgradeable-factory"
version = "0.1.0"
edition = "2021"
description = "Factory that deploys proxies and manages implementation upgrades with layout checks"
publish = false

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
ink = { version = "5.0.0", default-features = false }
scale = { package = "parity-scale-codec", version = "3.6.9", default-features = false, features = ["derive"] }
scale-info = { version = "2.10.0", default-features = false, features = ["derive"] }
upgradeable-proxy = { path = "../upgradeable-proxy", default-features = false, features = ["ink-as-dependency"] }

[features]
default = ["std"]
std = ["ink/std", "scale/std", "scale-info/std", "upgradeable-proxy/std"]
ink-as-dependency = []

# Standalone: not a member of the main workspace.
[workspace]
