[package]
name = "mock-oracle"
version = "1.0.0"
authors = ["PropChain Team <dev@propchain.io>"]
edition = "2021"
description = "Deterministic mock oracle for testnet staging — accepts prices via faucet-call"
license = "MIT"
homepage = "https://propchain.io"
repository = "https://github.com/MettaChain/PropChain-contract"
keywords = ["blockchain", "real-estate", "oracle", "mock", "testnet", "ink", "substrate"]
categories = ["cryptography::cryptocurrencies", "development-tools::testing"]
readme = "../../README.md"
publish = false

[dependencies]
ink = { workspace = true, default-features = false }
scale = { workspace = true, default-features = false, features = ["derive"] }
scale-info = { workspace = true, default-features = false, features = ["derive"] }
propchain-traits = { path = "../traits", default-features = false }

[lib]
name = "mock_oracle"
path = "src/lib.rs"
crate-type = ["cdylib"]

[features]
default = ["std", "mock"]
std = [
    "ink/std",
    "scale/std",
    "scale-info/std",
    "propchain-traits/std",
]
# ── Feature flag: mock ─────────────────────────────────────────────────────
# When `mock` is enabled the oracle returns deterministic prices derived from
# property_id. When disabled it only returns prices explicitly pushed via the
# `set_price` faucet-call message.
mock = []
ink-as-dependency = []

# Testing features
e2e-tests = []
