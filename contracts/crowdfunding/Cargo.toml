[package]
name = "propchain-crowdfunding"
version = "1.0.0"
authors = ["PropChain Team <dev@propchain.io>"]
edition = "2021"
description = "Decentralized real estate crowdfunding platform with compliance, governance, and secondary markets"
license = "MIT"
homepage = "https://propchain.io"
repository = "https://github.com/MettaChain/PropChain-contract"
keywords = ["blockchain", "real-estate", "smart-contracts", "ink", "crowdfunding"]
categories = ["cryptography::cryptocurrencies"]
publish = false

[dependencies]
ink = { workspace = true }
scale = { workspace = true }
scale-info = { workspace = true }
propchain-traits = { path = "../traits", default-features = false }

# No [dev-dependencies]: this crate's tests are the inline `#[cfg(test)]` unit
# tests, and it has no `tests/` integration directory. The `ink_e2e` dev-dependency
# that used to be declared here was never used, but it pulls in the whole
# substrate stack (sp-io -> sp-state-machine -> trie-db), and trie-db 0.28.0
# does not compile on the nightly toolchain this repo pins. That made
# `cargo test -p propchain-crowdfunding` fail before running a single test.

[lib]
name = "propchain_crowdfunding"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["std"]
std = [
    "ink/std",
    "scale/std",
    "scale-info/std",
    "propchain-traits/std",
]
ink-as-dependency = []
e2e-tests = []
