name: Smoke CI Gate

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read

jobs:
  smoke-test:
    name: Code Quality & Testing Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Install Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo Build Artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-smoke-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-smoke-

      - name: Check Code Formatting Style (fmt)
        run: cargo fmt --check

      - name: Execute Static Analysis Compiler Lints (clippy)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Core Verification Tests (test)
        run: cargo test --all-features --workspace

      - name: Check Markdown Internal Links (ARCHITECTURE.md)
        run: |
          # Verify all relative links in ARCHITECTURE.md resolve to real files.
          # Exits non-zero if any link target is missing.
          python3 - <<'EOF'
          import re, sys, pathlib

          root = pathlib.Path(".")
          src  = root / "ARCHITECTURE.md"
          text = src.read_text()

          # Match relative markdown links: [label](./path) or [label](path)
          pattern = re.compile(r'\[.*?\]\((\.\/|(?!https?://)(?!#))([^)#]+)')
          missing = []
          for m in pattern.finditer(text):
              target = (m.group(1) or "") + m.group(2)
              resolved = (src.parent / target).resolve()
              if not resolved.exists():
                  missing.append(target)

          if missing:
              print("Broken links in ARCHITECTURE.md:")
              for t in missing:
                  print(f"  {t}")
              sys.exit(1)
          else:
              print("All links in ARCHITECTURE.md resolve correctly.")
          EOF