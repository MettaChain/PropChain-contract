name: Nightly Security & Mutation Audit

# Least privilege (see issue #1207).
#
# This job only reads the repository and publishes its report as a workflow
# artifact. It must never be able to write to the repository: a compromised or
# maliciously-modified step in a nightly audit is exactly the privilege
# escalation chain the audit exists to catch.
#
# `contents: read` is the only scope granted. GitHub sets every scope that is
# not listed to `none`, so `pull-requests` and `issues` are already denied.
# There is deliberately no `security-events: write` either — nothing here uploads
# SARIF, and granting a write scope "in case" is the problem the issue names.
#
# The report used to be committed back to the repository with the
# `contents: write` token. That is gone: `AUDIT_LOG.md` is produced by the run
# and uploaded as the `security-audit-report` artifact (final step), so the copy
# checked into the repository is no longer rewritten by CI.

on:
  schedule:
    # Triggers every single night at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger for verification

permissions:
  contents: read

jobs:
  audit:
    name: Run Security and Mutation Suite
    runs-on: ubuntu-latest

    # Restated at job level so the scope the steps actually need is visible next
    # to them, and so a future change to the block above cannot silently widen
    # the token this job runs with.
    permissions:
      contents: read

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain (Nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-nightly-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Utility Tooling Engines
        run: |
          cargo install cargo-deny --locked || true
          cargo install cargo-audit --locked || true
          cargo install cargo-mutants --locked || true

      - name: Initialize or Clear Audit Log File
        run: |
          echo "# 🛡️ Automated Security & Mutation Audit Log" > AUDIT_LOG.md
          echo "Generated on: $(date -u)" >> AUDIT_LOG.md
          echo "---" >> AUDIT_LOG.md

      - name: Execute Cargo Deny Checks
        id: deny
        run: |
          echo "## 📦 Dependency License & Advisory Checks (cargo-deny)" >> AUDIT_LOG.md
          echo "\`\`\`text" >> AUDIT_LOG.md
          if cargo deny check licenses bans sources 2>&1 | tee -a AUDIT_LOG.md; then
            echo "deny_exit=0" >> "$GITHUB_OUTPUT"
          else
            echo "deny_exit=$?" >> "$GITHUB_OUTPUT"
            echo "::warning::cargo-deny flagged warnings or errors (see AUDIT_LOG.md)"
          fi
          echo "\`\`\`" >> AUDIT_LOG.md
          echo "---" >> AUDIT_LOG.md

      - name: Execute Cargo Audit Sweeps
        id: audit
        run: |
          echo "## 🔍 Vulnerability Advisory Scans (cargo-audit)" >> AUDIT_LOG.md
          echo "\`\`\`text" >> AUDIT_LOG.md
          set +e
          cargo audit 2>&1 | tee -a AUDIT_LOG.md
          AUDIT_EXIT=$?
          set -e
          echo "\`\`\`" >> AUDIT_LOG.md
          echo "---" >> AUDIT_LOG.md
          if [ "$AUDIT_EXIT" -ne 0 ]; then
            echo "::error::cargo-audit found vulnerabilities (exit code $AUDIT_EXIT). See AUDIT_LOG.md for details."
            echo "audit_exit=$AUDIT_EXIT" >> "$GITHUB_OUTPUT"
          else
            echo "audit_exit=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Mutants Gate — propchain-lending
        run: |
          set -o pipefail
          echo "## 🧬 Mutation Gate: lending" >> AUDIT_LOG.md
          echo "\`\`\`text" >> AUDIT_LOG.md
          cargo mutants -p propchain-lending --timeout 120 2>&1 | tee -a AUDIT_LOG.md
          echo "\`\`\`" >> AUDIT_LOG.md
          echo "---" >> AUDIT_LOG.md

      - name: Mutants Gate — propchain-bridge
        run: |
          set -o pipefail
          echo "## 🧬 Mutation Gate: bridge" >> AUDIT_LOG.md
          echo "\`\`\`text" >> AUDIT_LOG.md
          cargo mutants -p propchain-bridge --timeout 180 2>&1 | tee -a AUDIT_LOG.md
          echo "\`\`\`" >> AUDIT_LOG.md
          echo "---" >> AUDIT_LOG.md

      - name: Mutants Gate — oracle
        run: |
          set -o pipefail
          echo "## 🧬 Mutation Gate: oracle" >> AUDIT_LOG.md
          echo "\`\`\`text" >> AUDIT_LOG.md
          cargo mutants -p oracle --timeout 120 2>&1 | tee -a AUDIT_LOG.md
          echo "\`\`\`" >> AUDIT_LOG.md
          echo "---" >> AUDIT_LOG.md

      - name: Test Gate — bridge granular pauses, signature payloads, dex invariants
        run: |
          set -o pipefail
          echo "## 🧪 Test Gate: bridge granular pause / sig payload / dex invariants" >> AUDIT_LOG.md
          echo "\`\`\`text" >> AUDIT_LOG.md
          cargo test -p propchain-bridge granular_ 2>&1 | tee -a AUDIT_LOG.md
          cargo test -p propchain-bridge signed_payload 2>&1 | tee -a AUDIT_LOG.md
          cargo test -p propchain-bridge old_shape_approval 2>&1 | tee -a AUDIT_LOG.md
          cargo test -p propchain-dex swap_invariant 2>&1 | tee -a AUDIT_LOG.md
          echo "\`\`\`" >> AUDIT_LOG.md
          echo "---" >> AUDIT_LOG.md

      - name: Evaluate Audit Results
        if: always()
        run: |
          DENY_EXIT="${{ steps.deny.outputs.deny_exit }}"
          AUDIT_EXIT="${{ steps.audit.outputs.audit_exit }}"
          if [ "$DENY_EXIT" != "0" ] || [ "$AUDIT_EXIT" != "0" ]; then
            echo "::error::Security audit found issues. Review AUDIT_LOG.md and fix before proceeding."
            exit 1
          fi

      - name: Upload Security Audit Report
        # Evidence is published, not pushed: run on failure too so a red night
        # still leaves a report behind for triage.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-report
          path: AUDIT_LOG.md
          if-no-files-found: error
          retention-days: 30
