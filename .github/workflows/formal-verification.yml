name: Formal Verification (Kani)

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main, master]

jobs:
  kani-verification:
    name: Run Kani Proofs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-kani-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-kani-

      - name: Verify balance conservation
        uses: model-checking/kani-github-action@v1
        with:
          working-directory: contracts/lib
          args: >-
            --harness balance_proofs::prove_balance_conservation
            --harness balance_proofs::prove_no_balance_underflow

      - name: Verify access-control role membership
        uses: model-checking/kani-github-action@v1
        with:
          working-directory: contracts/lib
          args: >-
            --harness access_control_proofs::prove_non_admin_always_rejected
            --harness access_control_proofs::prove_admin_always_accepted

      - name: Verify oracle staleness bound
        uses: model-checking/kani-github-action@v1
        with:
          working-directory: contracts/lib
          args: >-
            --harness oracle_proofs::prove_stale_oracle_always_rejected
            --harness oracle_proofs::prove_fresh_oracle_always_accepted

      # Issue #1209: the value-movement arithmetic. These run against
      # `propchain-economic-models`, a dependency-free crate, because Kani has to
      # compile everything the target pulls in. See `docs/formal_verification.md`
      # for what each harness does and does not establish.
      - name: Verify lending borrow-rate curve
        uses: model-checking/kani-github-action@v1
        with:
          working-directory: economic-models
          args: >-
            --harness lending_rate_proofs::prove_rate_stays_within_documented_band
            --harness lending_rate_proofs::prove_rate_is_monotonic_in_utilisation
            --harness lending_rate_proofs::prove_rate_saturates_at_full_utilisation

      - name: Verify fee rounding and its dust bound
        uses: model-checking/kani-github-action@v1
        with:
          working-directory: economic-models
          args: >-
            --harness fee_rounding_proofs::prove_floor_never_exceeds_ceiling
            --harness fee_rounding_proofs::prove_dust_is_at_most_one_unit
            --harness fee_rounding_proofs::prove_ceiling_covers_the_exact_fee
            --harness fee_rounding_proofs::prove_zero_denominator_yields_no_fee

      - name: Verify staking reward-point maths
        uses: model-checking/kani-github-action@v1
        with:
          working-directory: economic-models
          args: >-
            --harness staking_points_proofs::prove_zero_stake_scores_no_points
            --harness staking_points_proofs::prove_points_are_monotonic_in_rewards
            --harness staking_points_proofs::prove_pending_is_zero_once_the_snapshot_catches_up
            --harness staking_points_proofs::prove_pending_is_monotonic_in_the_accumulator
