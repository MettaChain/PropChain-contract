[package]
name = "security-audit"   # crate name, also the name of the compiled binary
version = "0.1.0"         # current version of this tool
edition = "2021"          # Rust language edition (sets which language features are available)

[dependencies]
# Serialization: turns Rust structs into JSON and back. "derive" lets you add #[derive(Serialize, Deserialize)] to structs.
serde = { version = "1.0", features = ["derive"] }
# JSON support for serde (reading and writing JSON, e.g. audit reports).
serde_json = "1.0"
# Simple error handling: one catch-all error type with helpful messages.
anyhow = "1.0"
# Command-line argument parsing. "derive" lets you define flags by annotating a struct.
clap = { version = "4.0", features = ["derive"] }
# Dates and times (e.g. timestamping audit results).
chrono = "0.4"
# Colored terminal output (e.g. red for findings, green for passes).
colored = "2.0"
# Regular expressions, used to match patterns in files (e.g. secrets or risky code).
regex = "1.10"
# Walks through folders and subfolders recursively to find files to scan.
walkdir = "2.4"
